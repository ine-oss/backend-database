  
  path
    .api/register:
      post:
       summary: register new user
        tags :
           - Auth
         requestBody:
           required: 
             true
          content:
              application/json:
                schema:
                  type:object
                  properties:
                     fullName:
                        type:string
                      email:   
                       type:string  
                      phoneNumber
                       type:string  
                      password:
                        type:string 
                    required:
                        - fullName
                        -  password
                        -  email
                        - phoneNumber
          response:    
            201:
              description: user registered succesfully 
            401
              description: Bad request
                    



